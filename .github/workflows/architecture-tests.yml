name: Architecture Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Run Architecture Tests
      run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName~NuciAPI.Middleware.Security.ArchitectureTests"